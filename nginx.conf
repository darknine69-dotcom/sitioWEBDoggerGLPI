# Dogger HelpDesk — Nginx (versión HTTP)
# Sirve estáticos/media directamente y hace proxy a Gunicorn (web:8000).
#
# Este archivo sirve por HTTP y es el que funciona en local y detrás de un
# terminador TLS externo (Cloudflare, Caddy, el panel del hosting, un proxy
# de la empresa...). Para producción con HTTPS propio en este mismo Nginx,
# usa `nginx.https.conf` (ver README, sección Despliegue).
#
# OJO: aquí hay un solo bloque `server`. Nginx ignora el segundo bloque que
# repita `listen 80` + `server_name` (avisa "conflicting server name") y se
# queda con el primero; si ese primero no tiene `location`, todo request
# responde 404 aunque el segundo bloque estuviera bien escrito.

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 12m;

    # Desafío de Let's Encrypt (solo larenew). Se guarda en ./certs, el mismo
    # volumen que monta docker-compose en /etc/nginx/certs, así el renew no
    # necesita otro webroot. Ver el comando certbot en el README.
    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/certs;
        default_type "text/plain";
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
