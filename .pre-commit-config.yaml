repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2500"]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: sin-secretos
        name: Sin secretos en el código
        entry: python -c "import re,sys;pat=re.compile(r'(ghp_|AKIA|sk-live|-----BEGIN (RSA )?PRIVATE KEY-----)');mal=[l for l in open(sys.argv[1],encoding='utf-8',errors='ignore')];sys.exit(1) if any(pat.search(l) for f in sys.argv[1:] for l in open(f,encoding='utf-8',errors='ignore')) else sys.exit(0)"
        language: system
        types: [python]
        files: ^apps/|^config/
