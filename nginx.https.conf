# Dogger HelpDesk — Nginx con HTTPS (producción, p. ej. mi.com.co)
#
# Este archivo NO se monta solo: úsalo copiándolo sobre nginx.conf
#
#   cp nginx.https.conf nginx.conf
#   docker compose up -d
#
# ------------------------------------------------------------------
# ORDEN (importante: el bloque 443 no arranca sin certificados, así que
# pídelos ANTES de copiar este archivo):
#
# 1) Con el stack todavía en HTTP (nginx.conf por defecto, que sí sirve
#    /.well-known/acme-challenge/ desde ./certs), pide el certificado:
#
#       docker run --rm -p 80:80 -v "$PWD/certs:/etc/letsencrypt" \
#         certbot/certbot certonly --webroot -w /var/www/certbot \
#         -d mi.com.co -d www.mi.com.co \
#         --agree-tos -m correo@dogger.com.co
#
#    (los certificados quedan en ./certs/letsencrypt/live/mi.com.co/ y este
#     conf los lee tal cual de /etc/nginx/certs/letsencrypt/live/... porque
#     docker-compose monta ./certs en /etc/nginx/certs)
#
#    Alternativa sin depender de Nginx, parándolo un momento:
#       docker compose stop nginx
#       docker run --rm -p 80:80 -v "$PWD/certs:/etc/letsencrypt" \
#         certbot/certbot certonly --standalone \
#         -d mi.com.co -d www.mi.com.co --agree-tos -m correo@dogger.com.co
#       docker compose start nginx
#
# 2) Activa el TLS:   cp nginx.https.conf nginx.conf
#                     docker compose up -d
#
# 3) En .env: DJANGO_ALLOWED_HOSTS / DJANGO_CSRF_TRUSTED_ORIGINS con el
#    dominio y DJANGO_SECURE_SSL_REDIRECT=True, DJANGO_ENABLE_HSTS=True.
#
# 4) Renovar antes de 90 días (crontab del servidor, ej. 0 3 * * 1):
#       docker run --rm -p 80:80 -v "$PWD/certs:/etc/letsencrypt" \
#         certbot/certbot renew --webroot -w /var/www/certbot
#       docker compose restart nginx
#
# 5) Si tu dominio es otro, cambia "mi.com.co" en las 2 rutas de
#    ssl_certificate del bloque 443.
# ------------------------------------------------------------------

# --- HTTP: solo el desafío de Let's Encrypt; todo lo demás va a HTTPS ---
server {
    listen 80;
    server_name mi.com.co www.mi.com.co;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/certs;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: el sitio real ---
server {
    listen 443 ssl;
    http2 on;
    server_name mi.com.co www.mi.com.co;

    server_tokens off;
    client_max_body_size 12m;

    ssl_certificate     /etc/nginx/certs/letsencrypt/live/mi.com.co/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/letsencrypt/live/mi.com.co/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling off;   # sin DNS de Let's Encrypt no hay OCSP: no lo fuerces

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "same-origin" always;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $scheme es https aquí: Django usa SECURE_PROXY_SSL_HEADER y no
        # entra en bucle de redirección.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
