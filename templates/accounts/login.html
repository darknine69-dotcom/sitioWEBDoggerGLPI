{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dogger · Iniciar sesión</title>
    <link rel="stylesheet" href="{% static 'css/dogger-theme.css' %}?v=20260901">
</head>
<body>
<div class="login-screen">
    <div class="login-card">
        <img class="logo-badge" src="{% static 'images/dogger-logo.png' %}" alt="Dogger logo" />
        <p class="eyebrow">Dogger · Premium Quality</p>
        <h2>Iniciar sesión</h2>

        <form method="post" novalidate>
            {% csrf_token %}
            {% if form.non_field_errors %}
            <div class="login-error">
                {{ form.non_field_errors }}
            </div>
            {% endif %}

            <div class="form-group">
                <label for="{{ form.username.id_for_label }}">Correo corporativo</label>
                <div class="login-input-wrap">
                    <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                    {{ form.username }}
                </div>
            </div>
            <div class="form-group">
                <label for="{{ form.password.id_for_label }}">Contraseña</label>
                <div class="login-input-wrap">
                    <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    {{ form.password }}
                    <button type="button" class="login-eye-btn" onclick="togglePassword(this)" aria-label="Mostrar contraseña">
                        <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <div class="login-actions-row">
                <label class="login-remember-label">
                    {{ form.remember_me }}
                    <span>Recordarme</span>
                </label>
                <a href="{% url 'accounts:password_reset' %}" class="login-forgot-link">¿Olvidaste tu contraseña?</a>
            </div>
            <button type="submit" class="btn btn-primary">Iniciar sesión</button>
        </form>

        <p class="login-register-link">
            ¿Eres nuevo aquí? <a href="{% url 'accounts:registro' %}">Crea una cuenta</a>
        </p>

        <a href="{% url 'tickets:portal' %}" class="login-back-arrow" aria-label="Volver al portal público">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        </a>
    </div>
</div>
<script>
function togglePassword(btn) {
    const input = btn.parentElement.querySelector('input');
    const eyeOpen = btn.querySelector('.eye-open');
    const eyeClosed = btn.querySelector('.eye-closed');
    if (input.type === 'password') {
        input.type = 'text';
        eyeOpen.style.display = 'none';
        eyeClosed.style.display = 'block';
    } else {
        input.type = 'password';
        eyeOpen.style.display = 'block';
        eyeClosed.style.display = 'none';
    }
}
</script>
</body>
</html>
