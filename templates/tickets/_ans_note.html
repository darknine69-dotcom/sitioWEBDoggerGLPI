<div class="ans-note">
    <div class="ans-note-head">
        <svg class="icon icon-sm"><use href="#i-clock"/></svg>
        <strong class="ans-note-title">Tiempos de atención comprometidos (ANS)</strong>
        <button type="button" class="ans-note-help" tabindex="0"
            data-tip="Al elegir una categoría se asigna la prioridad y el tiempo máximo de resolución. Las fallas que detengan el punto de venta se atienden con la mayor urgencia."
            aria-label="Qué significa el ANS">
            <svg class="icon icon-sm"><use href="#i-help"/></svg>
        </button>
    </div>
    <ul class="ans-scale" id="ans-scale">
        <li class="ans-scale-item ans-scale-urgente" data-prioridad="urgente" data-tip="Detiene la venta o facturación">
            <span class="ans-scale-chip">
                <span class="ans-scale-chip-hours">2<span>h</span></span>
                <svg class="ans-scale-chip-clock"><use href="#i-clock"/></svg>
            </span>
            <span class="ans-scale-name">Urgente</span>
        </li>
        <li class="ans-scale-item ans-scale-alta" data-prioridad="alta" data-tip="Opera con limitaciones">
            <span class="ans-scale-chip">
                <span class="ans-scale-chip-hours">8<span>h</span></span>
                <svg class="ans-scale-chip-clock"><use href="#i-clock"/></svg>
            </span>
            <span class="ans-scale-name">Alta</span>
        </li>
        <li class="ans-scale-item ans-scale-media" data-prioridad="media" data-tip="Afectación parcial o secundaria">
            <span class="ans-scale-chip">
                <span class="ans-scale-chip-hours">12<span>h</span></span>
                <svg class="ans-scale-chip-clock"><use href="#i-clock"/></svg>
            </span>
            <span class="ans-scale-name">Media</span>
        </li>
        <li class="ans-scale-item ans-scale-baja" data-prioridad="baja" data-tip="Sin impacto directo en ventas">
            <span class="ans-scale-chip">
                <span class="ans-scale-chip-hours">48<span>h</span></span>
                <svg class="ans-scale-chip-clock"><use href="#i-clock"/></svg>
            </span>
            <span class="ans-scale-name">Baja</span>
        </li>
    </ul>
    <div id="ans-por-categoria" class="ans-active" hidden>
        <svg class="icon icon-sm"><use href="#i-check-circle"/></svg>
        <span>
            Tu categoría tiene prioridad <strong id="ans-active-prioridad"></strong> y tiempo máximo de
            resolución de <strong id="ans-active-horas"></strong>.
        </span>
    </div>
</div>

{% if ans_categorias_json %}
<script type="application/json" id="dogger-ans-cats">{{ ans_categorias_json|safe }}</script>
{% endif %}
