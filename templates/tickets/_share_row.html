<div class="share-row">
    {% if DOGGER.whatsapp_activo %}
    <a class="btn-share btn-whatsapp" href="https://wa.me/?text={{ share_text|urlencode }}"
       target="_blank" rel="noopener" title="Compartir por WhatsApp">
        <svg class="icon" aria-hidden="true"><use href="#i-whatsapp"/></svg> WhatsApp
    </a>
    {% endif %}
    {% if DOGGER.teams_activo %}
    <a class="btn-share btn-teams"
       href="https://teams.microsoft.com/share?placeholderText={{ share_text|urlencode }}"
       target="_blank" rel="noopener" title="Compartir en Teams">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="none"><circle cx="18" cy="6" r="3" fill="#aeb4ff"/><circle cx="12" cy="5" r="3.5" fill="#d5d8ff"/><path d="M15 10h6a2 2 0 0 1 2 2v4a4 4 0 0 1-4 4 4 4 0 0 1-4-4z" fill="#aeb4ff"/><path d="M8 10h9v6a5 5 0 0 1-5 5 5 5 0 0 1-5-5v-4a2 2 0 0 1 1-2z" fill="#d5d8ff"/><rect x="1" y="9" width="11" height="11" rx="1.5" fill="#fff"/><path d="M3.5 11.5h6v1.5h-2v5H5.6v-5H3.5z" fill="#5041c8"/></svg> Teams
    </a>
    {% endif %}
</div>
