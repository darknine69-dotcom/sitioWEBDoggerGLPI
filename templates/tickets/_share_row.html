<div class="share-row">
    {% if DOGGER.whatsapp_activo %}
    <a class="btn-share btn-whatsapp" href="https://wa.me/?text={{ share_text|urlencode }}"
       target="_blank" rel="noopener" title="Compartir por WhatsApp">
        <svg class="icon"><use href="#i-message"/></svg> WhatsApp
    </a>
    {% endif %}
    {% if DOGGER.teams_activo %}
    <a class="btn-share btn-teams"
       href="https://teams.microsoft.com/share?placeholderText={{ share_text|urlencode }}"
       target="_blank" rel="noopener" title="Compartir en Teams">
        <svg class="icon"><use href="#i-share"/></svg> Teams
    </a>
    {% endif %}
</div>
