{% comment %}FAB del monitoreo (admin): consultar tickets y generar reportes.{% endcomment %}
<div class="corp-fab" id="fabMonitoreo">
    <div class="corp-fab-menu">
        <a class="corp-fab-item" href="{% url 'tickets:lista' %}"><svg class="icon"><use href="#i-ticket"/></svg> Consultar tickets</a>
        <a class="corp-fab-item" href="{% url 'tickets:exportar_reportes' %}"><svg class="icon"><use href="#i-excel"/></svg> Generar reporte</a>
    </div>
    <button type="button" class="corp-fab-btn" aria-label="Acciones rápidas" aria-expanded="false">
        <svg class="icon"><use href="#i-plus"/></svg>
    </button>
</div>
<script>
(function () {
    var fab = document.getElementById("fabMonitoreo");
    if (!fab) return;
    var btn = fab.querySelector(".corp-fab-btn");
    btn.addEventListener("click", function () {
        var abierto = fab.hasAttribute("data-open");
        if (abierto) { fab.removeAttribute("data-open"); btn.setAttribute("aria-expanded", "false"); }
        else { fab.setAttribute("data-open", ""); btn.setAttribute("aria-expanded", "true"); }
    });
})();
</script>
