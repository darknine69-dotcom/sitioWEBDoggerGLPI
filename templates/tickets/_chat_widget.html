{% load static asset %}
{% comment %}Chat corporativo de soporte: FAB arrastrable + ventana Tidio.
Se muestra a todo rol autenticado; el hilo y los permisos salen del backend.{% endcomment %}
{% if request.user.is_authenticated %}
<div class="sw-fab" id="swFab" role="button" tabindex="0" aria-label="Abrir chat de soporte" title="Chat de soporte">
    <svg class="icon"><use href="#i-message"/></svg>
    <span class="sw-fab-count" id="swCount" hidden>0</span>
</div>
<section class="sw-win" id="swWin" aria-label="Chat de soporte">
    <div class="sw-head">
        <div class="sw-head-top">
            <strong>Mesa de ayuda</strong>
            <span class="sw-online">Estamos en línea</span>
            <button type="button" class="sw-head-x" id="swCerrar" aria-label="Cerrar chat">&times;</button>
        </div>
        <select class="sw-ticket" id="swTicket" aria-label="Conversación"></select>
    </div>
    <div class="sw-thread" id="swThread"></div>
    <div class="sw-composer">
        <button type="button" class="sw-icon-btn" id="swAdjuntar" title="Adjuntar imagen, PDF o documento" aria-label="Adjuntar archivo">
            <svg class="icon"><use href="#i-paperclip"/></svg>
        </button>
        <input type="file" id="swArchivo" hidden accept="image/png,image/jpeg,image/gif,image/webp,.pdf,.doc,.docx,.xls,.xlsx,.txt">
        <button type="button" class="sw-icon-btn" id="swEmojiBtn" title="Emojis" aria-label="Emojis" aria-expanded="false">😊</button>
        <textarea id="swTexto" rows="1" placeholder="Escríbenos…" aria-label="Escribe tu mensaje"></textarea>
        <button type="button" class="sw-send" id="swEnviar" title="Enviar" aria-label="Enviar mensaje">
            <svg class="icon"><use href="#i-send"/></svg>
        </button>
    </div>
</section>
<script>
window.__SW_URLS__ = {
    rol: "{{ request.user.rol }}",
    tickets: "{% url 'tickets:chat_tickets' %}",
    hilo: "{% url 'tickets:chat_hilo' 0 %}",
    responder: "{% url 'tickets:chat_responder' 0 %}",
    adjuntar: "{% url 'tickets:chat_adjuntar' 0 %}"
};
</script>
<script defer src="{% asset 'js/chat-widget.js' %}"></script>
{% endif %}
