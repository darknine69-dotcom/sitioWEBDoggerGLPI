{% comment %}Indicadores: verde activo, rojo incidencia, amarillo pendiente.{% endcomment %}
<span class="obs-dot obs-dot-verde" title="Activo: sin incidencias abiertas" aria-hidden="true"></span>
<span class="obs-dot obs-dot-rojo" title="Incidencia: hay una solicitud urgente sin resolver" aria-hidden="true"></span>
<span class="obs-dot obs-dot-amarillo" title="Pendiente: hay solicitudes en progreso" aria-hidden="true"></span>
