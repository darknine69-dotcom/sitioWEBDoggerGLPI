{% comment %}Tarjeta compacta de zona para el visor del supervisor.{% endcomment %}
<div class="pan-zc-wrap pan-zc-{% if e.ans_vencidos %}rojo{% elif e.ans_por_vencer %}amarillo{% else %}{{ e.estado }}{% endif %}" data-pan-wrap="{{ e.clave }}"{% if e.color %} style="--zc: {{ e.color }}"{% endif %}>
    <button type="button" class="pan-zc pan-zc-{% if e.ans_vencidos %}rojo{% elif e.ans_por_vencer %}amarillo{% else %}{{ e.estado }}{% endif %}" data-pan-clave="{{ e.clave }}" data-pan-nombre="{{ e.nombre }}">
        <span class="pan-zc-headline">
            <span class="pan-zc-ico"><svg class="icon"><use href="#i-store"/></svg></span>
            <span class="pan-zc-title"><b>{{ e.nombre|default:"Sin nombre" }}</b><small>{{ e.fecha|default:"Sin fecha" }}</small></span>
            <span class="pan-zc-state"><i></i>{% if e.ans_vencidos or e.estado == "rojo" %}Con incidencia{% elif e.ans_por_vencer or e.estado == "amarillo" %}Pendiente{% else %}Al día{% endif %}</span>
        </span>
        <span class="pan-zc-middle">
            <span class="pan-zc-metrics">
                <span><svg class="icon"><use href="#i-users"/></svg><b>{{ e.cuentas }}</b> cuenta{{ e.cuentas|pluralize }}</span>
                <span><svg class="icon"><use href="#i-ticket"/></svg><b>{{ e.abiertos }}</b> abiertos</span>
                <span><svg class="icon"><use href="#i-check-circle"/></svg><b>{{ e.cerrados }}</b> cerrados</span>
            </span>
            <span class="pan-zc-spark" title="Distribución real: tickets, abiertos, cerrados y ANS vencidos" aria-label="Distribución real de tickets">{% for valor in e.spark %}<i style="--bar:{{ valor }}"></i>{% endfor %}</span>
        </span>
        <span class="pan-zc-progress"><span><i style="width:{{ e.avance }}%"></i></span><b>{{ e.avance }}%</b></span>
        <span class="pan-zc-activity"><svg class="icon"><use href="#i-calendar"/></svg>Última actividad: {{ e.ultima_actividad }}</span>
    </button>
    {% if e.pk %}{% include "observador/_zona_acciones.html" with z=e %}{% endif %}
</div>
