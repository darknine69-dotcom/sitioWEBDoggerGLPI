services:
  - type: web
    name: dogger-helpdesk
    runtime: python
    # Render ya no tiene plan "free" (desde finales de 2025).
    # Usa un plan de pago o despliega con Docker/otro PaaS (ver Dockerfile + docker-compose).
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    disk:
      name: media-files
      mountPath: /opt/render/project/src/media
      sizeGB: 1
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # Reemplaza por tu URL real del servicio, p.ej.:
      #   DJANGO_ALLOWED_HOSTS=tu-servicio.onrender.com
      #   DJANGO_CSRF_TRUSTED_ORIGINS=https://tu-servicio.onrender.com
      - key: DJANGO_ALLOWED_HOSTS
        value: "tu-servicio.onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://tu-servicio.onrender.com"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "False"
      - key: DJANGO_MEDIA_ROOT
        value: "/opt/render/project/src/media"
      - key: DATABASE_URL
        fromDatabase:
          name: dogger-db
          property: connectionString
      - key: GLPI_ENABLED
        value: "False"
      - key: DOGGER_CORREO
        value: "sistemasbogota@dogger.com.co"
      - key: DOGGER_WHATSAPP
        value: "3103716129"

databases:
  - name: dogger-db
    # Render ya no ofrece plan "free"; usa uno de pago o tu propia BD PostgreSQL.
    plan: starter
    databaseName: dogger
    user: dogger_user
