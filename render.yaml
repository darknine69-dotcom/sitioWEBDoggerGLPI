services:
  - type: web
    name: dogger-helpdesk
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # ⚠️ Después del primer deploy, actualiza con tu URL real de Render:
      #    DJANGO_ALLOWED_HOSTS=tu-servicio.onrender.com
      #    DJANGO_CSRF_TRUSTED_ORIGINS=https://tu-servicio.onrender.com
      - key: DJANGO_ALLOWED_HOSTS
        value: "sitiowebdoggerglpi.onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://sitiowebdoggerglpi.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: dogger-db
          property: connectionString
      - key: GLPI_ENABLED
        value: "False"
      - key: DOGGER_CORREO
        value: "sistemasbogota@dogger.com.co"
      - key: DOGGER_WHATSAPP
        value: "3103716129"

databases:
  - name: dogger-db
    plan: free
    databaseName: dogger
    user: dogger_user
